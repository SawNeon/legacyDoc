# Nginx da v2. Coloque em /etc/nginx/sites-available/legacydoc-v2 e crie o
# link em sites-enabled. O certbot reescreve este arquivo ao emitir o cert.
#
# Layout de subdominios:
#   api.legacydoc.com.br  -> esta API (v2)
#   app.legacydoc.com.br  -> front web
#   legacydoc.com.br      -> landing page (fora deste arquivo)
#
# Enquanto o DNS nao propagar, dois hostnames servem sem comprar nada e ja
# aceitam certificado Let's Encrypt:
#   api-136-0-53-82.sslip.io   app-136-0-53-82.sslip.io
#
# Diferencas em relacao ao arquivo da v1, todas com motivo:
#
# - proxy_read_timeout maior: a v1 usava o padrao de 60s e um repositorio
#   grande estourava 504 no meio do processamento. Na v2 a API responde 202 em
#   milissegundos, entao 60s ate bastaria; mantemos folga porque upload de zip
#   e clone continuam sendo requisicoes longas.
# - Rate limit nas rotas de autenticacao: a v1 nao tinha nenhum, e registro
#   aberto sem limite e um convite a esgotar a cota de LLM de graca.
# - Sem `location /pdfs`: os artefatos nao sao mais arquivos publicos.

# Zonas de rate limit. Precisam ficar no escopo http; se o arquivo for incluido
# dentro de um bloco server, mova estas duas linhas para /etc/nginx/nginx.conf.
#
# Estes numeros ficam ACIMA dos da aplicacao (apps/api/legacydoc_api/ratelimit.py)
# de proposito. A borda e um escudo contra enxurrada: rejeita barato e sem saber
# quem chamou. O limite fino e o da aplicacao, que responde 429 com Retry-After
# e o mesmo envelope de erro das outras falhas. Quem bate no limite normal ve a
# resposta util; quem tenta derrubar o servidor para no nginx.
limit_req_zone $binary_remote_addr zone=legacydoc_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=legacydoc_api:10m rate=300r/m;

upstream legacydoc_api {
    # 8001, nao 8000: a v1 continua na 8000 enquanto as duas convivem.
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name api.legacydoc.com.br;

    # Tamanho maximo de corpo: cobre o upload de zip. Mantenha alinhado com o
    # limite da aplicacao para o cliente receber erro claro, e nao um 413 seco.
    client_max_body_size 25m;

    # Nao entregue a versao do nginx a quem esta sondando.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/legacydoc-access.log;
    error_log  /var/log/nginx/legacydoc-error.log warn;

    # ------------------------------------------------------------- auth
    # Toda a superficie de credencial, nao so login e registro: a redefinicao
    # de senha dispara e-mail, entao sem limite vira relay de spam contra um
    # endereco escolhido pelo atacante.
    location ~ ^/v1/auth/(register|login|password-reset/(request|confirm))$ {
        limit_req zone=legacydoc_auth burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://legacydoc_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -------------------------------------------------------------- api
    location / {
        limit_req zone=legacydoc_api burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://legacydoc_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Clone e upload sao lentos; polling e rapido. Este teto cobre os dois.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Download de artefato e gerado sob demanda: nao bufferize em disco.
        proxy_buffering off;
    }

    # Healthcheck sem rate limit e sem log, para o monitoramento nao poluir.
    location = /health {
        proxy_pass http://legacydoc_api;
        include /etc/nginx/proxy_params;
        access_log off;
    }
}

# ---------------------------------------------------------------------------
# Front estatico. Sirva num server separado (ou noutro dominio) para que o
# fallback de SPA nunca engula uma rota da API - foi o que aconteceu no
# servidor atual, onde /health devolvia o index.html do front.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name app.legacydoc.com.br;

    root /var/www/legacydoc;
    index index.html;
    server_tokens off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache: e ele que aponta para os assets versionados.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
